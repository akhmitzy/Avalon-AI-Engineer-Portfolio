name: ci

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [policy-reindexed]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Eval gate (offline, deterministic)
        run: python -m dxreview.evals.run --report eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: python/eval-report.json }

  live-evals:
    # Runs against the real model when a key is configured. Not required for merge.
    if: github.event_name != 'pull_request' && vars.RUN_LIVE_EVALS == 'true'
    runs-on: ubuntu-latest
    needs: python
    defaults: { run: { working-directory: python } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m dxreview.evals.run --provider anthropic --report live-eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-eval-report, path: python/live-eval-report.json }

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust/phi-scrubber } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go/worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go mod tidy && git diff --exit-code go.mod || true
      - run: go vet ./...
      - run: go test -race ./...

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix: { package: [mcp-server, n8n-nodes-dxreview] }
    defaults: { run: { working-directory: "ts/${{ matrix.package }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [python, rust, go]
    strategy:
      matrix: { image: [api, worker, phi-scrub] }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/${{ matrix.image }}.Dockerfile -t dxreview-${{ matrix.image }}:ci .
