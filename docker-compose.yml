# Local stack: API (offline provider by default), Postgres with pgvector, Kafka, worker, n8n.
#   docker compose up --build
#   curl -s localhost:8080/healthz
# Set DXREVIEW_PROVIDER=anthropic and ANTHROPIC_API_KEY to use Claude.
services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DXREVIEW_PROVIDER: ${DXREVIEW_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DXREVIEW_API_KEY: ${DXREVIEW_API_KEY:-dev-key}
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dxreview
      POSTGRES_PASSWORD: dxreview
      POSTGRES_DB: dxreview
    ports: ["5432:5432"]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      KAFKA_BROKERS: kafka:9092
      DXREVIEW_API_URL: http://api:8080
      DXREVIEW_API_KEY: ${DXREVIEW_API_KEY:-dev-key}
    depends_on: [api, kafka]
    restart: on-failure

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      DXREVIEW_API_URL: http://api:8080
    ports: ["5678:5678"]
    volumes:
      - ./n8n/workflows:/workflows:ro
