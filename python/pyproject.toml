[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dxreview"
version = "0.3.0"
description = "Agentic prior-authorization evidence review for lab and genetic tests"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
pgvector = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "anthropic>=0.40", "boto3>=1.34"]

[project.scripts]
dxreview-evals = "dxreview.evals.run:main"

[tool.setuptools.packages.find]
include = ["dxreview*"]

[tool.setuptools.package-data]
"dxreview.phi" = ["patterns.json"]
"dxreview.policies" = ["data/*.md"]
"dxreview.evals" = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP042"]  # FastAPI defaults; long regex/prompt lines; keep (str, Enum)
