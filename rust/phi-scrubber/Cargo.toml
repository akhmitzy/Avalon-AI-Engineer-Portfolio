[package]
name = "phi-scrubber"
version = "0.3.0"
edition = "2021"
description = "PHI scrubber for clinical notes; parity-tested against the Python reference implementation"
license-file = "../../LICENSE"

[lib]
name = "phi_scrubber"
path = "src/lib.rs"

[[bin]]
name = "phi-scrub"
path = "src/main.rs"

[dependencies]
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
